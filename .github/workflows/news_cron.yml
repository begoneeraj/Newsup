name: NewsUp News Cron

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch: {}

concurrency:
  group: pipeline-run
  cancel-in-progress: false

jobs:
  scrape-and-process:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Cache HuggingFace models
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-hf-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run news ingestion
        id: ingest
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          NEWSDATA_API_KEY: ${{ secrets.NEWSDATA_API_KEY }}
          MEDIASTACK_API_KEY: ${{ secrets.MEDIASTACK_API_KEY }}
        run: |
          set -o pipefail
          python src/main.py --sources news 2>&1 | tee pipeline_output.log

      - name: Verify pipeline actually processed articles
        if: always()
        run: |
          # Catches the case the ingest step's own exit code can't: a run
          # that returns 0 (main.py logs+swallows per-item exceptions) but
          # never actually reached Groq/Supabase because every fetcher
          # failed silently upstream. See src/main.py's collect_raw_items
          # ("Collected %d raw items") and main() ("Pipeline run complete.").
          if [ "${{ steps.ingest.outcome }}" != "success" ]; then
            echo "::error::News ingestion step failed (outcome=${{ steps.ingest.outcome }}). Groq/Supabase calls may not have completed."
            exit 1
          fi

          collected_line=$(grep -o 'Collected [0-9]\+ raw items' pipeline_output.log || true)
          if [ -z "$collected_line" ]; then
            echo "::error::No item-collection log line found — ingestion may have exited before fetching or processing anything."
            exit 1
          fi

          collected_count=$(echo "$collected_line" | grep -o '[0-9]\+')
          if [ "$collected_count" -eq 0 ]; then
            echo "::error::Ingestion step exited successfully but 0 articles were collected across all sources (Google News, NewsData, Mediastack, RSS, Reddit, PRS, eLibrary, arXiv, BusinessLine) — this usually means every fetcher failed silently. Check API keys/rate limits."
            exit 1
          fi

          if ! grep -q "Pipeline run complete." pipeline_output.log; then
            echo "::error::Ingestion step did not log 'Pipeline run complete' — it likely crashed partway through a Groq call or Supabase write without failing the step."
            exit 1
          fi

          echo "Pipeline verified: $collected_count articles collected and processing completed."
