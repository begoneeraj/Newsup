name: Build Google Play bundle

on:
  workflow_dispatch:
    inputs:
      policy_base_url:
        description: Public HTTPS policy website (must already be published)
        required: true
        type: string

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Validate public policy pages
        env:
          POLICY_BASE_URL: ${{ inputs.policy_base_url }}
        run: |
          python - <<'PY'
          import os, urllib.parse, urllib.request
          base = os.environ['POLICY_BASE_URL'].rstrip('/') + '/'
          parsed = urllib.parse.urlparse(base)
          assert parsed.scheme == 'https' and parsed.hostname and not parsed.username
          for page in ('privacy.html', 'delete-account.html', 'contact.html'):
              with urllib.request.urlopen(urllib.parse.urljoin(base, page), timeout=20) as response:
                  assert response.status == 200
                  assert 'TruthLens India' in response.read().decode('utf-8')
          PY
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Decode upload keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > android/app/truthlens-release.jks
      - name: Build signed app bundle
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          POLICY_BASE_URL: ${{ inputs.policy_base_url }}
          RELEASE_STORE_FILE: truthlens-release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$SUPABASE_URL" && test -n "$SUPABASE_PUBLISHABLE_KEY"
          flutter build appbundle --release \
            --dart-define=PLAY_STORE=true \
            --dart-define=POLICY_BASE_URL="$POLICY_BASE_URL" \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"
          python scripts/verify_play_bundle.py build/app/outputs/bundle/release/app-release.aab
      - uses: actions/upload-artifact@v4
        with:
          name: TruthLensIndia-play-bundle
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/bundle/release/app-release.verification.json
          retention-days: 14
      # This workflow deliberately stops at a downloadable artifact. Console
      # declarations, testing access and Google review are separate launch gates.
