name: NewsUp Underreported Topics Cron

on:
  schedule:
    # Daily - a single day's niche-vs-mainstream count is noisy; the
    # gap_score trend across several days (see underreported_topic_points)
    # is the actually useful signal, same reasoning as slow_crisis_quant.
    - cron: '30 4 * * *'
  workflow_dispatch: {}

jobs:
  update-underreported-topics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-hf-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run underreported topics update
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python src/main.py --sources underreported_topics

      - name: Run underreported topics narrative update (weekly)
        if: github.event.schedule == '30 4 * * 1' || github.event_name == 'workflow_dispatch'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python src/main.py --sources underreported_topics_narrative
